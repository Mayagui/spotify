version: '3.8'

services:
  db:
    image: postgres:15
    container_name: spotify_project_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spotify_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: spotify_project_web
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/spotify_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

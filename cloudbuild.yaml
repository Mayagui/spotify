steps:
  # Étape 1 : Build de l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'
      - '.'

  # Étape 2 : Push de l'image dans Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'

  # Étape 3 : Déploiement sur Cloud Run
  # Les secrets sont montés directement depuis Secret Manager par Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spotify-groupmix'
      - '--image=gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest'
      - '--set-secrets=SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest'
      - '--set-secrets=SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest'
      - '--set-secrets=SPOTIFY_REDIRECT_URI=SPOTIFY_REDIRECT_URI:latest'
      - '--set-secrets=TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest'
      - '--set-secrets=APP_SECRET_KEY=APP_SECRET_KEY:latest'

images:
  - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'

logsBucket: 'gs://spotify-groupmix-logs'

options:
  logging: GCS_ONLY

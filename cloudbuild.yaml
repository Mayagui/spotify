steps:
  # Étape 1 : Build de l'image Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'
      - '.'

  # Étape 2 : Push de l'image dans Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'

  # Étape 3 : Déploiement sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spotify-groupmix'
      - '--image=gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--set-env-vars=DATABASE_URL=$$DATABASE_URL'
      - '--set-env-vars=SPOTIFY_CLIENT_ID=$$SPOTIFY_CLIENT_ID'
      - '--set-env-vars=SPOTIFY_CLIENT_SECRET=$$SPOTIFY_CLIENT_SECRET'
      - '--set-env-vars=SPOTIFY_REDIRECT_URI=$$SPOTIFY_REDIRECT_URI'
      - '--set-env-vars=TOKEN_ENCRYPTION_KEY=$$TOKEN_ENCRYPTION_KEY'
      - '--set-env-vars=APP_SECRET_KEY=$$APP_SECRET_KEY'
    secretEnv:
      - 'DATABASE_URL'
      - 'SPOTIFY_CLIENT_ID'
      - 'SPOTIFY_CLIENT_SECRET'
      - 'SPOTIFY_REDIRECT_URI'
      - 'TOKEN_ENCRYPTION_KEY'
      - 'APP_SECRET_KEY'

images:
  - 'gcr.io/$PROJECT_ID/spotify-groupmix:$COMMIT_SHA'

logsBucket: 'gs://spotify-groupmix-logs'

options:
  logging: GCS_ONLY

# Les secrets sont lus depuis Google Secret Manager
# Pour les créer : gcloud secrets create SPOTIFY_CLIENT_ID --data-file=-
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/SPOTIFY_CLIENT_ID/versions/latest
      env: 'SPOTIFY_CLIENT_ID'
    - versionName: projects/$PROJECT_ID/secrets/SPOTIFY_CLIENT_SECRET/versions/latest
      env: 'SPOTIFY_CLIENT_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/SPOTIFY_REDIRECT_URI/versions/latest
      env: 'SPOTIFY_REDIRECT_URI'
    - versionName: projects/$PROJECT_ID/secrets/TOKEN_ENCRYPTION_KEY/versions/latest
      env: 'TOKEN_ENCRYPTION_KEY'
    - versionName: projects/$PROJECT_ID/secrets/APP_SECRET_KEY/versions/latest
      env: 'APP_SECRET_KEY'
